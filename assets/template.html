<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root { color-scheme: light; font-family: "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif; }
* { box-sizing: border-box; }
body { margin: 0; padding: 28px 20px; background: #eef2f6; color: #152b42; }
.studio { max-width: 1280px; margin: auto; }
.heading { display: flex; justify-content: space-between; align-items: baseline; gap: 20px; margin-bottom: 16px; }
.heading h1 { font-size: 22px; margin: 0; }
.heading span { font-size: 13px; color: #576f84; }
.stage-box { overflow: hidden; border-radius: 18px; background: white; box-shadow: 0 12px 45px #243e5510; }
#stage { display: block; width: 100%; height: auto; }
.stage-box.zoomed { overflow: auto; }
.live-caption { display: none; }
.controls { display: flex; align-items: center; gap: 12px; padding: 16px 0; flex-wrap: wrap; }
button, select { font: inherit; font-size: 14px; padding: 9px 14px; background: white; border: 1px solid #cbd5df; border-radius: 8px; cursor: pointer; color: #152b42; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid #1e79ce; outline-offset: 3px; }
button.primary { background: #193f61; border-color: #193f61; color: white; min-width: 76px; }
#timeline { flex: 1; min-width: 140px; accent-color: #193f61; }
#timeLabel { font-size: 13px; font-variant-numeric: tabular-nums; min-width: 96px; }
.notes { font-size: 13px; line-height: 1.8; color: #576f84; margin: 4px 0; }
details { font-size: 13px; line-height: 1.8; margin-top: 16px; }
details a { color: #1c689b; overflow-wrap: anywhere; }
.export-mode { padding: 0; background: white; }
.export-mode .heading, .export-mode .controls, .export-mode .notes, .export-mode details, .export-mode .live-caption { display: none; }
.export-mode .studio { max-width: none; margin: 0; }
.export-mode .stage-box { border-radius: 0; box-shadow: none; }
@media(max-width:600px) { body { padding: 16px 10px; } .heading { display:block; } .heading h1 {font-size:18px;} .heading span {display:block; margin-top:6px;} .controls {gap:8px;} button,select {padding:8px 10px;} #timeline {order:5; flex-basis:100%;} .live-caption { display:block; font-size:17px; line-height:1.7; margin:14px 4px 0; font-weight:600; } }
</style>
</head>
<body>
<main class="studio">
<div class="heading"><h1 id="pageTitle"></h1><span>离线动画 · 可暂停与拖动进度</span></div>
<div class="stage-box"><svg id="stage" role="img" aria-label="科研原理动画" xmlns="http://www.w3.org/2000/svg"></svg></div>
<p class="live-caption" id="mobileCaption" aria-live="polite"></p>
<div class="controls" role="group" aria-label="动画播放控制">
<button class="primary" id="play" type="button" aria-label="播放动画">播放</button>
<button id="reset" type="button">重播</button>
<button id="zoom" type="button" aria-pressed="false">放大画面</button>
<input id="timeline" type="range" min="0" max="1" step="0.01" value="0" aria-label="动画进度">
<output id="timeLabel" for="timeline">0.0 / 0.0 秒</output>
<label>速度 <select id="speed" aria-label="播放速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label>
</div>
<p class="notes" id="description"></p>
<p class="notes">空格：播放或暂停；左右方向键：移动进度。画面运动速度仅用于说明原理。</p>
<details><summary>来源与示意范围</summary><div id="evidence"></div></details>
</main>
<script id="animation-data" type="application/json">__SPEC__</script>
<script>__PLAYER__</script>
</body>
</html>
